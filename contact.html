        <style>
    body
    {margin:30px;background-color:palevioletred;color:darkred;font-family:'Courier New',monospace;transition:background-color 0.5s,color 0.5s;}

    .dark-mode
    {background-color:black;color:white;}

    .dark-mode .nav
    {background-color:dimgray;color:white;}
        
    .dark-mode .footer
    {background-color:dimgray;color:white;}

    .nav
    {display:flex;justify-content:center;gap:30px;background-color:pink;border:solid;padding:15px;margin-bottom:20px;}

    .nav a
    {text-decoration:none;color:darkred;font-weight:bold;}

    .dark-mode .nav a
    {color:white;}

    button
    {color:darkred;font-family:'Courier New', monospace;padding: 10px 20px;font-size:12px;border:solid;border-color:darkred;background-color:pink;}

    button:hover
    {background-color:white;}

    .dark-mode button
    {background-color:dimgray;color:white;border:solid;border-color:white;}

    .dark-mode button:hover

    .column
    {display:flex;flex-direction:column;gap:20px;flex:1;}

    {background-color:pink;border:solid;padding:20px;margin: 0 auto; max-width: 900px;}

    .footer
    {margin-top:40px;text-align:right;padding:10px;background-color:pink;border:solid;}

    img
    {max-width:100%;height:auto;display:block;}

    </style>

    function toggledarkmode()
    {document.body.classList.toggle("dark-mode");}
</script>
